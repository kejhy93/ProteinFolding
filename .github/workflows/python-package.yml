# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

permissions:
  contents: read

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        # python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libopenblas-dev liblapack-dev gfortran
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        # Exact-pinned (not a range) since SonarCloud's dependency-locking rule
        # requires a single resolved version, not a compatible-release range.
        python -m pip install --upgrade pip==25.2
        python -m pip install flake8==7.3.0 pytest==9.1.1
        # requirements.txt is now a hash-locked file (every direct and transitive
        # dependency pinned with --hash) covering the Python versions actually in
        # this matrix (3.11-3.15), so --only-binary=:all: is safe here: all pinned
        # wheels exist for those versions, and --require-hashes rejects anything
        # that doesn't match the recorded hash, including any sdist/setup.py build.
        if [ -f requirements.txt ]; then pip install --only-binary=:all: --require-hashes -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest tests/
